<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>早睡系统 · 暖色方案</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #0f0b16;
  color: #f0ece4;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.phone {
  width: 390px;
  height: 820px;
  background: linear-gradient(180deg, #120c1a 0%, #1a1228 40%, #1e1630 100%);
  border-radius: 44px;
  border: 1px solid rgba(200, 180, 230, 0.1);
  overflow: hidden;
  position: relative;
  box-shadow: 0 0 0 1px rgba(200, 180, 230, 0.05), 0 24px 80px rgba(0,0,0,0.6);
}

/* Glow orbs */
.phone::before {
  content: '';
  position: absolute;
  top: -80px;
  right: -60px;
  width: 220px;
  height: 220px;
  background: radial-gradient(circle, rgba(200, 150, 255, 0.12), transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.phone::after {
  content: '';
  position: absolute;
  bottom: 100px;
  left: -40px;
  width: 160px;
  height: 160px;
  background: radial-gradient(circle, rgba(255, 180, 100, 0.08), transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}

.status-bar {
  display: flex;
  justify-content: space-between;
  padding: 16px 28px 8px;
  font-size: 13px;
  font-weight: 500;
  color: #d4c8e0;
  position: relative;
  z-index: 1;
}

.content {
  padding: 8px 24px 0;
  display: flex;
  flex-direction: column;
  height: calc(100% - 50px);
  position: relative;
  z-index: 1;
}

/* Greeting */
.greeting {
  margin-bottom: 4px;
}
.greeting h1 {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.3px;
  background: linear-gradient(135deg, #f0ece4, #d4c8e0);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.greeting p {
  font-size: 14px;
  color: #8a7a9a;
  margin-top: 2px;
}

/* Streak row */
.streak-row {
  display: flex;
  gap: 8px;
  margin: 16px 0;
}
.streak-item {
  flex: 1;
  background: rgba(200, 180, 230, 0.04);
  border: 1px solid rgba(200, 180, 230, 0.08);
  border-radius: 16px;
  padding: 16px 12px;
  text-align: center;
  backdrop-filter: blur(4px);
}
.streak-num {
  font-size: 26px;
  font-weight: 700;
  line-height: 1.1;
}
.streak-num .primary { color: #b8a0e0; }
.streak-num .warm { color: #f0b888; }
.streak-num .cool { color: #88c8e8; }
.streak-label {
  font-size: 11px;
  color: #6a5a7a;
  font-weight: 500;
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Target section */
.target-box {
  background: linear-gradient(135deg, rgba(180, 140, 220, 0.1), rgba(240, 184, 136, 0.06));
  border: 1px solid rgba(180, 140, 220, 0.12);
  border-radius: 18px;
  padding: 18px 20px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(4px);
}
.target-label { font-size: 12px; color: #8a7a9a; font-weight: 500; letter-spacing: 0.3px; }
.target-time { font-size: 24px; font-weight: 700; color: #f0ece4; letter-spacing: -0.3px; }
.target-sub { font-size: 12px; color: #6a5a7a; margin-top: 2px; }
.target-status { text-align: right; }
.target-status .badge {
  display: inline-block;
  background: rgba(240, 184, 136, 0.15);
  color: #f0b888;
  font-size: 12px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 20px;
}

/* Main actions */
.actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}
.btn-sleep {
  background: linear-gradient(135deg, #7a5ab8, #a070d8);
  border: none;
  border-radius: 20px;
  padding: 24px;
  color: white;
  font-size: 20px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  box-shadow: 0 8px 32px rgba(160, 112, 216, 0.3);
  transition: transform 0.15s;
  letter-spacing: -0.2px;
}
.btn-sleep:active { transform: scale(0.97); }
.btn-sleep .icon { font-size: 26px; }
.btn-sleep .sub {
  font-size: 13px;
  font-weight: 400;
  opacity: 0.7;
}
.btn-wake {
  background: rgba(200, 180, 230, 0.05);
  border: 1px solid rgba(200, 180, 230, 0.1);
  border-radius: 20px;
  padding: 18px;
  color: #d4c8e0;
  font-size: 18px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  backdrop-filter: blur(4px);
  transition: background 0.15s;
}
.btn-wake:active { background: rgba(200, 180, 230, 0.1); }
.btn-wake .icon { font-size: 22px; }

/* Log card */
.log-card {
  background: rgba(200, 180, 230, 0.03);
  border: 1px solid rgba(200, 180, 230, 0.08);
  border-radius: 18px;
  padding: 18px 20px;
  margin-bottom: 16px;
  backdrop-filter: blur(4px);
}
.log-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.log-card-header h3 {
  font-size: 13px;
  font-weight: 600;
  color: #6a5a7a;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.log-card-header a {
  font-size: 12px;
  color: #b8a0e0;
  text-decoration: none;
  font-weight: 500;
}
.log-entry {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(200, 180, 230, 0.04);
}
.log-entry:last-child { border-bottom: none; }
.log-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 12px var(--glow);
}
.log-dot.bed { background: #b8a0e0; --glow: rgba(184, 160, 224, 0.3); }
.log-dot.wake { background: #88c8e8; --glow: rgba(136, 200, 232, 0.3); }
.log-dot.curfew { background: #f0b888; --glow: rgba(240, 184, 136, 0.3); }
.log-info { flex: 1; }
.log-info .label { font-size: 14px; color: #d4c8e0; font-weight: 500; }
.log-info .time { font-size: 12px; color: #6a5a7a; }
.log-check { font-size: 14px; }
.log-check.good { color: #88c8e8; }
.log-check.warn { color: #f0b888; }

/* Ad */
.ad-placeholder {
  margin-top: auto;
  margin-bottom: 12px;
  background: rgba(200, 180, 230, 0.03);
  border: 1px dashed rgba(200, 180, 230, 0.06);
  border-radius: 14px;
  padding: 10px;
  text-align: center;
  font-size: 11px;
  color: #4a3a5a;
}

/* Nav */
.nav-bar {
  display: flex;
  justify-content: space-around;
  padding: 8px 12px 12px;
  border-top: 1px solid rgba(200, 180, 230, 0.05);
}
.nav-item {
  text-align: center;
  font-size: 10px;
  color: #6a5a7a;
  font-weight: 500;
  padding: 4px 12px;
  transition: color 0.2s;
}
.nav-item.active { color: #b8a0e0; }
.nav-item .nav-icon { font-size: 20px; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>23:15</span>
    <span>📶 🔋</span>
  </div>
  <div class="content">
    <div class="greeting">
      <h1>🌙 晚上好</h1>
      <p>今晚的目标是 23:00 · 还剩 0 分钟</p>
    </div>

    <div class="streak-row">
      <div class="streak-item">
        <div class="streak-num"><span class="primary">3</span></div>
        <div class="streak-label">连续天数</div>
      </div>
      <div class="streak-item">
        <div class="streak-num"><span class="warm">67%</span></div>
        <div class="streak-label">宵禁达标率</div>
      </div>
      <div class="streak-item">
        <div class="streak-num"><span class="cool">7h</span></div>
        <div class="streak-label">平均睡眠</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-sleep">
        <span class="icon">🌙</span>
        <span>准备睡觉</span>
        <span class="sub">放下手机</span>
      </button>
      <button class="btn-wake">
        <span class="icon">☀️</span>
        <span>我起床了</span>
      </button>
    </div>

    <div class="log-card">
      <div class="log-card-header">
        <h3>昨晚</h3>
        <a href="#">查看详情 →</a>
      </div>
      <div class="log-entry">
        <div class="log-dot bed"></div>
        <div class="log-info">
          <div class="label">就寝</div>
          <div class="time">23:15</div>
        </div>
        <div class="log-check good">✅</div>
      </div>
      <div class="log-entry">
        <div class="log-dot wake"></div>
        <div class="log-info">
          <div class="label">起床</div>
          <div class="time">07:30</div>
        </div>
        <div class="log-check good">✅</div>
      </div>
      <div class="log-entry">
        <div class="log-dot curfew"></div>
        <div class="log-info">
          <div class="label">宵禁</div>
          <div class="time">打卡后无使用</div>
        </div>
        <div class="log-check good">✅ 达标</div>
      </div>
    </div>

    <div class="ad-placeholder">
      [ 广告位 · 你的早晨由 XXX 陪伴 ]
    </div>

    <div class="nav-bar">
      <div class="nav-item active"><div class="nav-icon">🌙</div>首页</div>
      <div class="nav-item"><div class="nav-icon">📊</div>报告</div>
      <div class="nav-item"><div class="nav-icon">🏆</div>成就</div>
      <div class="nav-item"><div class="nav-icon">⚙️</div>设置</div>
    </div>
  </div>
</div>
</body>
</html>
